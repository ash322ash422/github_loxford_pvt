
name: House Price API - Docker Hub CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Test, Build and Push Docker Image

    runs-on: ubuntu-latest

    steps:
      # STEP 1: Download project from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # STEP 3: Install Python libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 4: Train and validate ML model
      - name: Train ML model
        run: python train.py

      # STEP 5: Run FastAPI tests
      - name: Run automated tests
        run: pytest -v

      # STEP 6: Prepare Docker builder
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # STEP 7: Login to Docker Hub
      # Only needed for main branch / manual runs.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 8: Build Docker image and publish
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/house-price-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/house-price-api:${{ github.sha }}
