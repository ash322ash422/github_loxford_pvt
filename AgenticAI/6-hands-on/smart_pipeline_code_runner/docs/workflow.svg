<svg xmlns="http://www.w3.org/2000/svg" width="940" height="980" viewBox="0 0 940 980">
<title>Smart Pipeline LangGraph workflow</title>
<desc>Compiled graph with a bounded code repair loop and trusted archive stage.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526681"/></marker></defs>
<rect width="940" height="980" fill="#f5f8fc"/>
<g font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#17304d">
<text x="35" y="32" font-size="23" font-weight="bold">Smart Pipeline: compiled LangGraph workflow</text>
<path d="M 320 105 L 320 140" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 320 730 L 320 785" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 320 530 L 320 565" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 320 445 L 320 480" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 320 360 L 320 395" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 320 275 L 320 310" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 320 190 L 320 225" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 320 615 L 320 680" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="52" y="465" font-size="13">Invalid: repair</text>
<text x="52" y="485" font-size="13">Max 2 repairs</text>
<text x="52" y="545" font-size="13">Live mode only</text>
<path d="M 170 590 H 45 V 420 H 170" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="720" y="635" font-size="13">Invalid; attempts exhausted</text>
<text x="720" y="655" font-size="13">or offline execution failed</text>
<text x="720" y="675" font-size="13">No archive</text>
<path d="M 470 590 H 710 V 810 H 470" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 320 835 L 320 870" fill="none" stroke="#526681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="335" y="655" font-size="13">Valid</text>
<rect x="170" y="55" width="300" height="50" rx="12" fill="#ffffff" stroke="#526681"/>
<text x="320" y="85" text-anchor="middle">Start</text>
<rect x="170" y="140" width="300" height="50" rx="12" fill="#ffffff" stroke="#526681"/>
<text x="320" y="170" text-anchor="middle">Scan + snapshot inputs</text>
<rect x="170" y="225" width="300" height="50" rx="12" fill="#ffffff" stroke="#526681"/>
<text x="320" y="255" text-anchor="middle">Profile CSVs + inspect context</text>
<rect x="170" y="310" width="300" height="50" rx="12" fill="#ffffff" stroke="#526681"/>
<text x="320" y="340" text-anchor="middle">Create sales processing plan</text>
<rect x="170" y="395" width="300" height="50" rx="12" fill="#dbeafe" stroke="#526681"/>
<text x="320" y="425" text-anchor="middle">Generate / repair Python code</text>
<rect x="170" y="480" width="300" height="50" rx="12" fill="#ffffff" stroke="#526681"/>
<text x="320" y="510" text-anchor="middle">Execute in Docker</text>
<rect x="170" y="565" width="300" height="50" rx="12" fill="#ffffff" stroke="#526681"/>
<text x="320" y="595" text-anchor="middle">Validate records + totals</text>
<rect x="170" y="680" width="300" height="50" rx="12" fill="#ffffff" stroke="#526681"/>
<text x="320" y="710" text-anchor="middle">Archive eligible originals</text>
<rect x="170" y="785" width="300" height="50" rx="12" fill="#ffffff" stroke="#526681"/>
<text x="320" y="815" text-anchor="middle">Write report + manifest</text>
<rect x="170" y="870" width="300" height="50" rx="12" fill="#ffffff" stroke="#526681"/>
<text x="320" y="900" text-anchor="middle">End</text>
<text x="35" y="955" font-size="13">Topology exported from build_graph().get_graph(); drawing does not run the workflow.</text>
</g></svg>