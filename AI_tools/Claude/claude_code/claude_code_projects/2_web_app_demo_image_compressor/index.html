<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShrinkIt — Compress images in your browser</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-border: #334155;
    --accent: #38bdf8;
    --accent-dark: #0ea5e9;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --success: #4ade80;
    --error: #f87171;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header h1 {
    margin: 0 0 8px;
    font-size: 2.1rem;
  }

  header h1 span {
    color: var(--accent);
  }

  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 1rem;
  }

  .card {
    width: 100%;
    max-width: 560px;
  }

  #drop-zone {
    border: 2px dashed var(--panel-border);
    border-radius: 16px;
    background: var(--panel);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }

  #drop-zone.dragover {
    border-color: var(--accent);
    background: #1e2b40;
    transform: scale(1.01);
  }

  #drop-zone .icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
  }

  #drop-zone p.main {
    margin: 0 0 4px;
    font-size: 1.05rem;
  }

  #drop-zone p.sub {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  #file-input {
    display: none;
  }

  #error-message {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.4);
    color: var(--error);
    font-size: 0.9rem;
  }

  #loading {
    display: none;
    margin-top: 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  #result-card {
    display: none;
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 24px;
  }

  .preview-row {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
  }

  .preview-col {
    flex: 1;
    text-align: center;
  }

  .preview-col img {
    width: 100%;
    max-height: 160px;
    object-fit: contain;
    border-radius: 10px;
    background: repeating-conic-gradient(#2a2a2a 0% 25%, #1c1c1c 0% 50%) 50% / 16px 16px;
    border: 1px solid var(--panel-border);
  }

  .preview-col .label {
    margin-top: 8px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .preview-col .size {
    font-weight: 600;
    font-size: 1rem;
  }

  .savings {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    background: rgba(74, 222, 128, 0.1);
    color: var(--success);
    font-weight: 600;
    margin-bottom: 20px;
  }

  .savings.neutral {
    background: rgba(148, 163, 184, 0.1);
    color: var(--text-dim);
  }

  .actions {
    display: flex;
    gap: 12px;
  }

  button {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
    font-family: inherit;
  }

  button:active {
    transform: scale(0.98);
  }

  #download-btn {
    background: var(--accent);
    color: #04202e;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #download-btn:hover {
    filter: brightness(1.1);
  }

  #reset-btn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
  }

  #reset-btn:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }

  footer {
    margin-top: 40px;
    color: var(--text-dim);
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Shrink<span>It</span></h1>
  <p>Compress JPG &amp; PNG images entirely in your browser — nothing is uploaded anywhere.</p>
</header>

<div class="card">
  <div id="drop-zone" tabindex="0" role="button" aria-label="Upload an image">
    <div class="icon">🖼️</div>
    <p class="main">Drag &amp; drop a JPG or PNG here</p>
    <p class="sub">or click to browse</p>
    <input type="file" id="file-input" accept="image/jpeg,image/png">
  </div>

  <div id="error-message"></div>
  <div id="loading">Compressing…</div>

  <div id="result-card">
    <div class="preview-row">
      <div class="preview-col">
        <img id="original-preview" alt="Original image preview">
        <div class="label">Original</div>
        <div class="size" id="original-size">–</div>
      </div>
      <div class="preview-col">
        <img id="compressed-preview" alt="Compressed image preview">
        <div class="label">Compressed</div>
        <div class="size" id="compressed-size">–</div>
      </div>
    </div>

    <div class="savings" id="savings-message"></div>

    <div class="actions">
      <a id="download-btn" download>Download compressed image</a>
      <button id="reset-btn" type="button">Compress another</button>
    </div>
  </div>
</div>

<footer>All processing happens locally on your device. No files ever leave your browser.</footer>

<script>
(function () {
  const JPEG_QUALITY = 0.7;
  const ACCEPTED_TYPES = ['image/jpeg', 'image/png'];

  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const errorMessage = document.getElementById('error-message');
  const loading = document.getElementById('loading');
  const resultCard = document.getElementById('result-card');

  const originalPreview = document.getElementById('original-preview');
  const compressedPreview = document.getElementById('compressed-preview');
  const originalSizeEl = document.getElementById('original-size');
  const compressedSizeEl = document.getElementById('compressed-size');
  const savingsMessage = document.getElementById('savings-message');
  const downloadBtn = document.getElementById('download-btn');
  const resetBtn = document.getElementById('reset-btn');

  let currentObjectUrls = [];

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = 'block';
  }

  function clearError() {
    errorMessage.style.display = 'none';
    errorMessage.textContent = '';
  }

  function revokeObjectUrls() {
    currentObjectUrls.forEach(url => URL.revokeObjectURL(url));
    currentObjectUrls = [];
  }

  function trackObjectUrl(url) {
    currentObjectUrls.push(url);
    return url;
  }

  function resetUI() {
    revokeObjectUrls();
    resultCard.style.display = 'none';
    loading.style.display = 'none';
    clearError();
    fileInput.value = '';
    dropZone.style.display = '';
  }

  function baseNameWithoutExt(name) {
    const idx = name.lastIndexOf('.');
    return idx === -1 ? name : name.slice(0, idx);
  }

  function extensionFor(mimeType) {
    return mimeType === 'image/png' ? '.png' : '.jpg';
  }

  function handleFile(file) {
    clearError();

    if (!file) return;

    if (!ACCEPTED_TYPES.includes(file.type)) {
      showError('Unsupported file type. Please upload a JPG or PNG image.');
      return;
    }

    loading.style.display = 'block';
    resultCard.style.display = 'none';

    const img = new Image();
    const originalUrl = trackObjectUrl(URL.createObjectURL(file));

    img.onload = function () {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const outputType = file.type;
        const toBlobArgs = outputType === 'image/png'
          ? [outputType]
          : [outputType, JPEG_QUALITY];

        canvas.toBlob(function (blob) {
          loading.style.display = 'none';

          if (!blob) {
            showError('Could not process this image. It may be corrupted.');
            return;
          }

          const compressedUrl = trackObjectUrl(URL.createObjectURL(blob));

          originalPreview.src = originalUrl;
          compressedPreview.src = compressedUrl;
          originalSizeEl.textContent = formatBytes(file.size);
          compressedSizeEl.textContent = formatBytes(blob.size);

          const savedBytes = file.size - blob.size;
          const savedPct = file.size > 0 ? (savedBytes / file.size) * 100 : 0;

          if (savedBytes > 0) {
            savingsMessage.textContent = `Saved ${savedPct.toFixed(0)}% (${formatBytes(savedBytes)} smaller)`;
            savingsMessage.classList.remove('neutral');
          } else {
            savingsMessage.textContent = 'This image is already well optimized — no further savings found.';
            savingsMessage.classList.add('neutral');
          }

          const downloadName = baseNameWithoutExt(file.name) + '-compressed' + extensionFor(outputType);
          downloadBtn.href = compressedUrl;
          downloadBtn.download = downloadName;

          dropZone.style.display = 'none';
          resultCard.style.display = 'block';
        }, ...toBlobArgs);
      } catch (err) {
        loading.style.display = 'none';
        showError('Something went wrong while compressing this image.');
      }
    };

    img.onerror = function () {
      loading.style.display = 'none';
      showError('Could not load this image. It may be corrupted or an unsupported format.');
    };

    img.src = originalUrl;
  }

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      fileInput.click();
    }
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    handleFile(file);
  });

  ['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('dragover');
    });
  });

  dropZone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    handleFile(file);
  });

  resetBtn.addEventListener('click', resetUI);
})();
</script>

</body>
</html>
